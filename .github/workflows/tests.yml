name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  format-check:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install formatting tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8

      - name: Run Black formatting
        run: |
          black .

      - name: Commit formatting changes
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Auto-format with black [skip ci]"
            git push origin "$HEAD_REF"
          else
            echo "No formatting changes detected."
          fi

      - name: Lint with flake8 (errors)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 smoek --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint with flake8 (warnings)
        run: |
          # Exit-zero treats all errors as warnings
          flake8 smoek --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

  tests:
    name: Test Python ${{ matrix.python-version }}
    needs: format-check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Cache conda environment
        uses: actions/cache@v4
        with:
          path: |
            ~/conda_pkgs_dir
            ~/.conda
            ~/miniconda3/envs
          key: conda-${{ matrix.os }}-${{ matrix.python-version }}-${{ hashFiles('dev_environment.yml') }}
          restore-keys: |
            conda-${{ matrix.os }}-${{ matrix.python-version }}-
            conda-${{ matrix.os }}-

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          channels: conda-forge,defaults
          activate-environment: smoek_dev
          environment-file: dev_environment.yml
          use-mamba: true

      - name: Install package
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest -v smoek

  backend-tests:
    name: Test with ${{ matrix.backend }} backend
    needs: format-check
    strategy:
      fail-fast: false
      matrix:
        backend: ["pyomo-only", "poek", "coek"]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Cache conda environment
        uses: actions/cache@v4
        with:
          path: |
            ~/conda_pkgs_dir
            ~/.conda
            ~/miniconda3/envs
          key: conda-backend-${{ matrix.backend }}-${{ hashFiles('dev_environment.yml') }}
          restore-keys: |
            conda-backend-${{ matrix.backend }}-
            conda-backend-

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          auto-update-conda: true
          python-version: "3.13"
          channels: conda-forge,defaults
          activate-environment: smoek_dev
          environment-file: dev_environment.yml
          use-mamba: true

      - name: Install base package
        run: pip install -e ".[test]"

      - name: Install poek backend
        if: matrix.backend == 'poek'
        run: pip install poek || echo "poek not available, tests will be skipped"

      - name: Install coek backend
        if: matrix.backend == 'coek'
        run: pip install coek || echo "coek not available, tests will be skipped"

      - name: Run tests
        run: pytest -v smoek

  coverage:
    name: Coverage Report
    needs: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Cache conda environment
        uses: actions/cache@v4
        with:
          path: |
            ~/conda_pkgs_dir
            ~/.conda
            ~/miniconda3/envs
          key: conda-coverage-${{ hashFiles('dev_environment.yml') }}
          restore-keys: |
            conda-coverage-

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          auto-update-conda: true
          python-version: "3.13"
          channels: conda-forge,defaults
          activate-environment: smoek_dev
          environment-file: dev_environment.yml
          use-mamba: true

      - name: Install package with all backends
        run: |
          pip install -e ".[test,backends]" || pip install -e ".[test]"

      - name: Run tests with coverage
        run: |
          pytest --cov=smoek --cov-branch --cov-report=xml --cov-report=term --junitxml=junit.xml -v smoek

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
